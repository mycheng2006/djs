<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
<title>随机抽取</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background: radial-gradient(circle at 50% 40%, #1c2c5a 0%, #0b1130 70%, #060a1d 100%);
    font-family: "Microsoft YaHei","PingFang SC",arial,sans-serif;
    color:#fff;
  }
  #stage { position:absolute; inset:0; overflow:hidden; }
  #stage span {
    position:absolute; left:50%; top:50%;
    white-space:nowrap; will-change:transform;
    transform-origin:50% 50%;
    color:#fff; font-size:22px; user-select:none;
    text-shadow: 0 0 6px rgba(120,180,255,0.5);
    transition: color .3s;
  }
  #stage span.picked { color:#ffd84d; text-shadow: 0 0 12px rgba(255,200,0,0.9); }

  #result {
    position:absolute; left:0; top:50%; width:100%;
    transform:translateY(-50%); text-align:center;
    display:none; z-index:100; pointer-events:none;
  }
  #result span {
    display:inline-block; font-size:60px; padding:16px 34px;
    background:#fff; color:#111; margin:8px; border-radius:12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.7);
    font-weight:bold;
  }

  .tools { position:absolute; right:20px; bottom:20px; z-index:200; }
  .tools button {
    display:inline-block; margin:5px; padding:10px 20px;
    font-size:16px; border:none; border-radius:6px;
    background:#e6e6e6; color:#333; cursor:pointer;
    font-family:inherit;
  }
  .tools button:hover { filter:brightness(1.08); }
  .tools button.active { background:#ca3c3c; color:#fff; }
  .tools .start { background:#1cb841; color:#fff; }
  .tools .stop  { background:#ca3c3c; color:#fff; }
  .tools .reset { background:#df7514; color:#fff; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="result"></div>
<div class="tools">
  <button data-count="3">3</button>
  <button data-count="2">2</button>
  <button data-count="1" class="active">1</button>
  <button id="btnStart" class="start">开始</button>
  <button id="btnReset" class="reset">重置</button>
</div>

<script src="member.js"></script>
<script>
(function(){
  var stage   = document.getElementById('stage');
  var resultEl = document.getElementById('result');
  var btnStart = document.getElementById('btnStart');
  var btnReset = document.getElementById('btnReset');
  var countBtns = document.querySelectorAll('.tools button[data-count]');

  // 已抽取记录
  var choosed = {};
  try { choosed = JSON.parse(localStorage.getItem('choosed') || '{}'); } catch(e){}

  function getKey(m){ return m.name + '|' + (m.phone || ''); }

  // 生成名字元素
  var items = member.map(function(m, i){
    var el = document.createElement('span');
    el.textContent = m.name;
    if (choosed[getKey(m)]) el.className = 'picked';
    stage.appendChild(el);
    return { el: el, data: m };
  });

  // 球面均匀分布（斐波那契球）
  var N = items.length;
  var inc = Math.PI * (3 - Math.sqrt(5));
  var off = 2 / N;
  items.forEach(function(it, i){
    var y = i * off - 1 + off/2;
    var r = Math.sqrt(Math.max(0, 1 - y*y));
    var phi = i * inc;
    it.x = Math.cos(phi) * r;
    it.y = y;
    it.z = Math.sin(phi) * r;
  });

  // 旋转参数
  var angleY = 0, angleX = 0;
  var velY = 0.006, velX = 0.0015;
  var running = false;
  var radius = 300;
  var focal  = 900;

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    radius = Math.min(w, h) * 0.36;
    focal  = Math.max(w, h) * 1.2;
  }
  resize();
  window.addEventListener('resize', resize);

  function render(){
    var cy = Math.cos(angleY), sy = Math.sin(angleY);
    var cx = Math.cos(angleX), sx = Math.sin(angleX);

    for (var i = 0; i < items.length; i++){
      var it = items[i];
      // 绕 Y 轴
      var x1 =  it.x * cy - it.z * sy;
      var z1 =  it.x * sy + it.z * cy;
      // 绕 X 轴
      var y2 =  it.y * cx - z1 * sx;
      var z2 =  it.y * sx + z1 * cx;

      var scale = focal / (focal - z2 * radius);
      var tx = x1 * radius * scale;
      var ty = y2 * radius * scale;

      var depth = (z2 + 1) / 2;                 // 0 远 ~ 1 近
      var alpha = 0.2 + 0.8 * depth;
      var size  = 12 + 14 * depth;

      it.el.style.transform =
        'translate(-50%,-50%) translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
      it.el.style.fontSize = size.toFixed(1) + 'px';
      it.el.style.opacity  = alpha.toFixed(3);
      it.el.style.zIndex   = (depth * 1000) | 0;
    }

    angleY += velY;
    angleX += velX;
    // X 轴轻微摆动
    if (angleX > 0.35) velX = -Math.abs(velX);
    if (angleX < -0.35) velX = Math.abs(velX);

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // 抽签
  function draw(n){
    var pool = items.filter(function(it){
      return !choosed[getKey(it.data)];
    });
    if (!pool.length) return [];
    // 洗牌
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    var picked = pool.slice(0, n);
    picked.forEach(function(it){
      choosed[getKey(it.data)] = 1;
      it.el.className = 'picked';
    });
    try { localStorage.setItem('choosed', JSON.stringify(choosed)); } catch(e){}
    return picked.map(function(it){ return it.data.name; });
  }

  // 抽签数量按钮
  var selected = 1;
  countBtns.forEach(function(b){
    b.addEventListener('click', function(){
      countBtns.forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      selected = parseInt(b.dataset.count, 10);
      resultEl.style.display = 'none';
    });
  });

  // 开始/停止
  btnStart.addEventListener('click', function(){
    if (!running){
      velY = 0.30; velX = 0.06;
      running = true;
      btnStart.textContent = '停止';
      btnStart.className = 'stop';
      resultEl.style.display = 'none';
    } else {
      velY = 0.006; velX = 0.0015;
      running = false;
      btnStart.textContent = '开始';
      btnStart.className = 'start';

      var names = draw(selected);
      if (!names.length){
        resultEl.innerHTML = '<span>已抽完</span>';
      } else {
        resultEl.innerHTML = names.map(function(n){
          return '<span>' + n + '</span>';
        }).join('');
      }
      resultEl.style.display = 'block';
    }
  });

  // 重置
  btnReset.addEventListener('click', function(){
    if (confirm('确定要重置么？所有之前的抽取历史将被清除！')){
      try { localStorage.removeItem('choosed'); } catch(e){}
      location.reload();
    }
  });
})();
</script>
</body>
</html>
