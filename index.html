<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
<title>随机抽取</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background: radial-gradient(circle at 50% 45%, #16224e 0%, #0a1030 55%, #04071a 100%);
    font-family: "Microsoft YaHei","PingFang SC",arial,sans-serif;
    color:#fff;
  }
  #bgCanvas { position:absolute; inset:0; z-index:0; pointer-events:none; }
  #halo {
    position:absolute; left:50%; top:50%;
    width: 70vmin; height:70vmin;
    margin-left:-35vmin; margin-top:-35vmin;
    border-radius:50%;
    background: radial-gradient(circle,
      rgba(120,180,255,0.28) 0%,
      rgba(80,130,255,0.14) 35%,
      rgba(40,80,200,0.04) 60%,
      transparent 75%);
    z-index:1; pointer-events:none;
    animation: haloBreath 6s ease-in-out infinite;
  }
  @keyframes haloBreath {
    0%,100% { transform: scale(1);   opacity: 0.85; }
    50%     { transform: scale(1.1); opacity: 1; }
  }
  #stage {
    position:absolute; inset:0; overflow:hidden;
    z-index:2; transform-origin: 50% 50%;
  }
  #stage.pulse { animation: stagePulse 0.7s ease-out; }
  @keyframes stagePulse {
    0%   { transform: scale(1);    filter: brightness(1); }
    25%  { transform: scale(1.06); filter: brightness(1.8) saturate(1.4); }
    100% { transform: scale(1);    filter: brightness(1); }
  }
  #stage span {
    position:absolute; left:50%; top:50%;
    white-space:nowrap; will-change:transform, opacity;
    transform-origin:50% 50%;
    color:#fff; font-size:22px; user-select:none;
    text-shadow: 0 0 6px rgba(120,180,255,0.6);
    transition: color .3s;
    /* 强制 GPU 合成 */
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transform: translate3d(0,0,0);
  }
  #stage span.picked {
    color: #555 !important;
    text-shadow: none !important;
    opacity: 0.55 !important;
    text-decoration: line-through;
    font-style: italic;
  }
  #result {
    position:absolute; inset:0;
    display:none; z-index:100;
    background: rgba(8, 12, 30, 0.35);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    align-items:center; justify-content:center;
    flex-wrap:wrap; align-content:center;
    gap: 0.8vh 1.6vw;
    padding: 3vh 3vw;
    overflow:hidden;
    animation: fadeIn 0.35s ease both;
  }
  #result.show { display:flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #result span {
    display:inline-block;
    line-height: 1.1;
    font-weight: 700;
    color: #ffe08a;
    background: linear-gradient(180deg, #fff3c4 0%, #ffcf55 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    padding: 0.05em 0.2em;
    letter-spacing: 0.04em;
    white-space: nowrap;
    filter:
      drop-shadow(0 0 6px rgba(255,210,90,0.55))
      drop-shadow(0 0 18px rgba(255,160,40,0.35));
    animation: pop 0.5s cubic-bezier(0.25, 1.3, 0.4, 1) both;
  }
  @keyframes pop {
    0%   { transform: scale(0.75); opacity: 0; }
    60%  { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }

  .tools { position:absolute; right:20px; bottom:20px; z-index:200; }
  .tools button {
    display:inline-block; margin:5px; padding:10px 20px;
    font-size:16px; border:none; border-radius:6px;
    background:#e6e6e6; color:#333; cursor:pointer;
    font-family:inherit;
  }
  .tools button:hover { filter:brightness(1.08); }
  .tools button.active { background:#ca3c3c; color:#fff; }
  .tools .start { background:#1cb841; color:#fff; }
  .tools .stop  { background:#ca3c3c; color:#fff; }
  .tools .reset { background:#df7514; color:#fff; }
  .tools .voice { background:#7e57c2; color:#fff; }
  .tools .voice.off { background:#888; }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div id="halo"></div>
<div id="stage"></div>
<div id="result"></div>
<div class="tools">
  <button data-count="6">6</button>
  <button data-count="3">3</button>
  <button data-count="2">2</button>
  <button data-count="1" class="active">1</button>
  <button id="btnStart" class="start">开始</button>
  <button id="btnReset" class="reset">重置抽取</button>
  <button id="btnVoice" class="voice">🔊 语音</button>
</div>

<script src="member.js"></script>

<script>
(function(){
  var bgCanvas = document.getElementById('bgCanvas');
  var bgCtx    = bgCanvas.getContext('2d');
  var stage    = document.getElementById('stage');
  var resultEl = document.getElementById('result');
  var btnStart = document.getElementById('btnStart');
  var btnReset = document.getElementById('btnReset');
  var btnVoice = document.getElementById('btnVoice');
  var countBtns = document.querySelectorAll('.tools button[data-count]');

  // ================= 名单 =================
  var people = [];
  if (typeof nameListText === 'string') {
    nameListText.split(/\r?\n/).forEach(function(line){
      line = line.trim();
      if (!line) return;
      var idx = line.indexOf('|');
      var disp, tts;
      if (idx >= 0) {
        disp = line.substring(0, idx).trim();
        tts  = line.substring(idx + 1).trim() || disp;
      } else {
        disp = line;
        tts  = line;
      }
      if (disp) people.push({ name: disp, tts: tts });
    });
  } else if (typeof member !== 'undefined' && member.length) {
    member.forEach(function(m){
      if (m.name) people.push({ name: m.name, tts: m.name });
    });
  }

  if (!people.length) {
    document.body.innerHTML =
      '<div style="padding:40px;color:#fff;font-size:20px;font-family:sans-serif;">' +
      '没找到名单，请检查 member.js。</div>';
    return;
  }

  // ================= 记录 =================
  var choosed = {};
  try { choosed = JSON.parse(localStorage.getItem('choosed_v10') || '{}'); } catch(e){}
  function saveChoosed(){
    try { localStorage.setItem('choosed_v10', JSON.stringify(choosed)); } catch(e){}
  }

  // ================= 星空（首屏只画一次,之后懒刷）=================
  var stars = [];
  function initStars(){
    var w = window.innerWidth, h = window.innerHeight;
    bgCanvas.width  = w;
    bgCanvas.height = h;
    stars = [];
    var count = Math.round(w * h / 14000);   // 少一点,启动快
    if (count < 60)  count = 60;
    if (count > 200) count = 200;
    for (var i = 0; i < count; i++){
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.6 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 1.2,
        base: 0.25 + Math.random() * 0.6,
        vx: (Math.random() - 0.5) * 0.06,
        vy: (Math.random() - 0.5) * 0.06
      });
    }
  }
  function drawStars(t){
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      s.x += s.vx; s.y += s.vy;
      if (s.x < 0) s.x = bgCanvas.width;
      if (s.x > bgCanvas.width) s.x = 0;
      if (s.y < 0) s.y = bgCanvas.height;
      if (s.y > bgCanvas.height) s.y = 0;
      var tw = 0.45 + 0.55 * Math.sin(t * 0.001 * s.speed + s.phase);
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bgCtx.fillStyle = 'rgba(180,210,255,' + (s.base * tw).toFixed(3) + ')';
      bgCtx.fill();
    }
  }

  // ================= 球体 =================
  var items = [];
  function buildStage(){
    // 先清空
    stage.innerHTML = '';
    items = [];

    // DocumentFragment 一次性挂载
    var frag = document.createDocumentFragment();
    var N = people.length;

    // 预计算位置
    var inc = Math.PI * (3 - Math.sqrt(5));
    var off = 2 / N;

    for (var i = 0; i < N; i++){
      var p = people[i];
      var el = document.createElement('span');
      el.textContent = p.name;
      if (choosed[p.name]) el.className = 'picked';

      // 缓存 style 引用,减少属性查找
      var st = el.style;
      // 直接设置初始 transform,避免首帧跳动
      st.transform = 'translate3d(0,0,0)';
      st.opacity = '0';

      frag.appendChild(el);

      // 球面坐标
      var y = i * off - 1 + off/2;
      var r = Math.sqrt(Math.max(0, 1 - y*y));
      var phi = i * inc;

      items.push({
        el: el,
        style: st,           // 缓存 style 引用
        name: p.name,
        tts: p.tts,
        x: Math.cos(phi) * r,
        y: y,
        z: Math.sin(phi) * r
      });
    }
    stage.appendChild(frag);
  }

  // ================= 动画 =================
  var angleY = 0, angleX = 0;
  var velY = 0, velX = 0;
  var targetVelY = 0.0025, targetVelX = 0.0008;
  var running = false;
  var radius = 300, focal = 900;
  var lastT = 0;

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    radius = Math.min(w, h) * 0.36;
    focal  = Math.max(w, h) * 1.2;
  }
  resize();

  function step(dt){
    // dt 归一化: 16.7ms 为 1
    var k = dt / 16.7;
    if (k > 3) k = 3;    // 掉帧时限制

    // 平滑加减速（系数 0.12,比之前 0.045 更快响应）
    velY += (targetVelY - velY) * 0.12 * k;
    velX += (targetVelX - velX) * 0.12 * k;
    angleY += velY * k;
    angleX += velX * k;
    if (angleX >  0.38) { angleX =  0.38; targetVelX = -Math.abs(targetVelX); }
    if (angleX < -0.38) { angleX = -0.38; targetVelX =  Math.abs(targetVelX); }

    var cy = Math.cos(angleY), sy = Math.sin(angleY);
    var cx = Math.cos(angleX), sx = Math.sin(angleX);

    for (var i = 0; i < items.length; i++){
      var it = items[i];
      var x1 =  it.x * cy - it.z * sy;
      var z1 =  it.x * sy + it.z * cy;
      var y2 =  it.y * cx - z1 * sx;
      var z2 =  it.y * sx + z1 * cx;
      var scale = focal / (focal - z2 * radius);
      var tx = x1 * radius * scale;
      var ty = y2 * radius * scale;
      var depth = (z2 + 1) / 2;

      // 用缓存的 style 引用,一次写入
      var st = it.style;
      st.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0) scale(' + scale.toFixed(3) + ') translate(-50%,-50%)';
      st.fontSize  = (10 + 16 * depth).toFixed(1) + 'px';
      st.opacity   = (0.15 + 0.85 * depth).toFixed(3);
      st.zIndex    = (depth * 1000) | 0;
      // 用 textShadow 代替 filter:brightness（GPU 合成器处理更快）
      st.textShadow = '0 0 ' + (6 + 10 * depth).toFixed(0) + 'px rgba(160,200,255,' + (0.35 + 0.55 * depth).toFixed(2) + ')';
    }
  }

  function render(t){
    var dt = lastT ? (t - lastT) : 16.7;
    lastT = t;
    step(dt);
    drawStars(t);
    requestAnimationFrame(render);
  }

  // ================= 抽签 =================
  function draw(n){
    var pool = [];
    for (var i = 0; i < items.length; i++){
      if (!choosed[items[i].name]) pool.push(items[i]);
    }
    if (!pool.length) return [];
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    var picked = pool.slice(0, n);
    for (var k = 0; k < picked.length; k++){
      choosed[picked[k].name] = 1;
      picked[k].el.className = 'picked';
    }
    saveChoosed();
    var ret = [];
    for (var m = 0; m < picked.length; m++) ret.push({ name: picked[m].name, tts: picked[m].tts });
    return ret;
  }

  // ================= 字号 =================
  function pickFontSize(count, w, h, maxLen){
    var cols, rows;
    if (count <= 1)      { cols = 1; rows = 1; }
    else if (count <= 2) { cols = 2; rows = 1; }
    else if (count <= 3) { cols = 3; rows = 1; }
    else if (count <= 4) { cols = 2; rows = 2; }
    else if (count <= 6) { cols = 3; rows = 2; }
    else                 { cols = Math.ceil(Math.sqrt(count)); rows = Math.ceil(count / cols); }
    var boxW = w * 0.75, boxH = h * 0.75;
    var cellW = boxW / cols - w * 0.02;
    var cellH = boxH / rows - h * 0.02;
    return Math.round(Math.min(cellW / Math.max(2, maxLen), cellH / 1.15));
  }

  // ================= 语音 =================
  var voiceOn = true;
  var speechSupported = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
  var zhVoice = null;

  function pickZhVoice(){
    if (!speechSupported) return null;
    var voices = window.speechSynthesis.getVoices();
    for (var i = 0; i < voices.length; i++){
      var v = voices[i];
      var lang = (v.lang || '').toLowerCase();
      if (lang.indexOf('zh') === 0 || lang.indexOf('cmn') === 0) {
        if (!zhVoice) zhVoice = v;
        if (/huihui|yaoyao|xiaoxiao|female|女/i.test(v.name)) { zhVoice = v; break; }
      }
    }
    return zhVoice;
  }
  if (speechSupported) {
    pickZhVoice();
    window.speechSynthesis.onvoiceschanged = pickZhVoice;
  }

  function speakNames(list){
    if (!voiceOn || !speechSupported || !list.length) return;
    try { window.speechSynthesis.cancel(); } catch(e){}
    if (!zhVoice) pickZhVoice();
    var idx = 0;
    function next(){
      if (idx >= list.length) return;
      var name = list[idx++];
      var u = new SpeechSynthesisUtterance(name);
      u.lang = 'zh-CN';
      if (zhVoice) u.voice = zhVoice;
      u.rate = 0.95; u.pitch = 1.0; u.volume = 1.0;
      u.onend = function(){ setTimeout(next, 120); };
      u.onerror = function(){ setTimeout(next, 120); };
      window.speechSynthesis.speak(u);
    }
    setTimeout(next, 350);
  }

  btnVoice.addEventListener('click', function(){
    if (!speechSupported){ alert('当前浏览器不支持语音，请用最新版 Chrome/Edge。'); return; }
    voiceOn = !voiceOn;
    if (voiceOn){
      btnVoice.textContent = '🔊 语音';
      btnVoice.className = 'voice';
      try {
        window.speechSynthesis.cancel();
        var t = new SpeechSynthesisUtterance('语音已开启');
        t.lang = 'zh-CN';
        if (zhVoice) t.voice = zhVoice;
        window.speechSynthesis.speak(t);
      } catch(e){}
    } else {
      btnVoice.textContent = '🔇 语音';
      btnVoice.className = 'voice off';
      try { window.speechSynthesis.cancel(); } catch(e){}
    }
  });

  // ================= 按钮 =================
  var selected = 1;
  countBtns.forEach(function(b){
    b.addEventListener('click', function(){
      countBtns.forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      selected = parseInt(b.dataset.count, 10);
      resultEl.classList.remove('show');
    });
  });

  function spinFast(){ targetVelY = 0.16; targetVelX = 0.035; }
  function spinIdle(){ targetVelY = 0.0025; targetVelX = 0.0008; }

  btnStart.addEventListener('click', function(){
    if (!running){
      spinFast();
      running = true;
      btnStart.textContent = '停止';
      btnStart.className = 'stop';
      resultEl.classList.remove('show');
      if (speechSupported) { try { window.speechSynthesis.cancel(); } catch(e){} }
    } else {
      spinIdle();
      running = false;
      btnStart.textContent = '开始';
      btnStart.className = 'start';

      var arr = draw(selected);

      stage.classList.remove('pulse');
      void stage.offsetWidth;
      stage.classList.add('pulse');
      setTimeout(function(){ stage.classList.remove('pulse'); }, 720);

      if (!arr.length){
        resultEl.innerHTML = '<span style="font-size:120px;-webkit-text-fill-color:#ffe08a;">已抽完</span>';
        resultEl.classList.add('show');
        return;
      }

      var w = window.innerWidth, h = window.innerHeight;
      var localMax = 2;
      arr.forEach(function(p){ if (p.name.length > localMax) localMax = p.name.length; });
      var fs = pickFontSize(arr.length, w, h, localMax);

      var html = '';
      for (var i = 0; i < arr.length; i++){
        html += '<span style="font-size:' + fs + 'px;animation-delay:' + (i * 0.12).toFixed(2) + 's;">' +
          arr[i].name.replace(/[&<>"']/g, function(c){
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
          }) + '</span>';
      }
      resultEl.innerHTML = html;
      resultEl.classList.add('show');

      var ttsArr = [];
      for (var k = 0; k < arr.length; k++) ttsArr.push(arr[k].tts);
      speakNames(ttsArr);
    }
  });

  btnReset.addEventListener('click', function(){
    if (confirm('确定要重置抽取记录么？（名单文件不受影响）')){
      choosed = {};
      saveChoosed();
      for (var i = 0; i < items.length; i++) items[i].el.className = '';
      resultEl.classList.remove('show');
      if (speechSupported) { try { window.speechSynthesis.cancel(); } catch(e){} }
    }
  });

  window.addEventListener('resize', function(){
    resize();
    initStars();
    if (!resultEl.classList.contains('show')) return;
    var spans = resultEl.querySelectorAll('span');
    if (!spans.length) return;
    var localMax = 2;
    for (var i = 0; i < spans.length; i++){
      if (spans[i].textContent.length > localMax) localMax = spans[i].textContent.length;
    }
    var fs = pickFontSize(spans.length, window.innerWidth, window.innerHeight, localMax);
    for (var i = 0; i < spans.length; i++) spans[i].style.fontSize = fs + 'px';
  });

  // ============ 启动（关键：先同步画一帧,页面秒出）============
  initStars();
  buildStage();
  step(16.7);          // 同步绘制首帧
  drawStars(0);        // 首帧星空
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
